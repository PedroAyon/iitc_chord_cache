x-node-env: &node-env
  LOG_LEVEL: ${LOG_LEVEL:-WARN}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  CACHE_CAPACITY: ${CACHE_CAPACITY:-10000}
  CACHE_TTL: ${CACHE_TTL:-20s}
  # Simulate LAN Cluster
  NET_DELAY: ${NET_DELAY:-0.25ms}
  NET_JITTER: ${NET_JITTER:-0.05ms}
  # Simulate WAN Cluster
  # NET_DELAY: ${NET_DELAY:-25ms}
  # NET_JITTER: ${NET_JITTER:-5ms}

services:
  chord-bootstrap:
    build:
      context: .
      target: node
    image: chord-node:latest
    environment:
      <<: *node-env
    cap_add: [NET_ADMIN]

  chord-node:
    image: chord-node:latest
    depends_on:
      - chord-bootstrap
    environment:
      <<: *node-env
      BOOTSTRAP_ADDR: chord-bootstrap:7000
    cap_add: [NET_ADMIN]

  chord-cli:
    build:
      context: .
      target: cli
    image: chord-cli:latest
    profiles: ["tools"]
    environment:
      CHORD_NODE: chord-bootstrap:7000
    volumes:
      - work:/work

volumes:
  work:
